upstream cal_price_backend {
    server cal_price_server:8088;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /cal_price/classify/classify_list {
        limit_except POST { deny all; }
        proxy_pass http://cal_price_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cal_price/public/districts {
        limit_except GET { deny all; }
        proxy_pass http://cal_price_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /cal_price/pricing_rule/min_pricing {
        limit_except POST { deny all; }
        proxy_pass http://cal_price_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /cal_price/ {
        return 404;
    }

    location ~* \.(?:ya?ml|conf)$ {
        return 404;
    }

    location ~* \.(?:js|css|png|svg|ico|webp)$ {
        try_files $uri =404;
        expires 1h;
    }
}
