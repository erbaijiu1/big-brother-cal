services:
  cal_price_server:
    image: cal-price-server:local
    build:
      context: ./cal_price_server
    container_name: cal_price_server
    restart: always
    expose:
      - "8088"
    env_file:
      - ./cal_price_server/docker_conf.env
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USER: ${CAL_PRICE_DB_USER:-root}
      DB_PASSWORD: ${CAL_PRICE_DB_PASSWORD:-Gmcc@123}
      DB_NAME: ${CAL_PRICE_DB_NAME:-db_prize_cal}
      CUSTOMER_QUOTE_SERVICE_TOKEN: ${CUSTOMER_QUOTE_SERVICE_TOKEN}
    volumes:
      - ../../server_data/cal_price_server/logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - web
